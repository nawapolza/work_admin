services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports: ["5000:5000"]
    volumes:
      - ./backend/models:/app/backend/models
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["5173:80"]
    depends_on: [api]

